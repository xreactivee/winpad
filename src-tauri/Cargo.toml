[package]
name = "winpad"
version = "1.0.1"
description = "macOS Launchpad style Start menu for Windows"
edition = "2021"
authors = ["xReactive"]

[lib]
name = "winpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["protocol-asset"] }
tauri-plugin-store = "=2.5.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-updater = "=2.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
png = "0.18.1"
windows-collections = "=0.3.2"

[dependencies.windows]
version = "0.62.2"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Search",
  "Win32_System_Rpc",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "ApplicationModel",
  "Devices_Enumeration",
  "Devices_Radios",
  "Devices_WiFi",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Networking_Connectivity",
  "Storage_Streams",
  "System_Power",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Web_Http",
]

[profile.release]
lto = true
codegen-units = 1
strip = true
